<!doctype html>
<html lang='en'>
	<head>
		<meta charset="UTF-8">
		<title>Todo app</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name=”description” content="A small todo app">
		<meta property='og:image' content='https://peprojects.dev/beta3/johnb/images/sticky.webp'>
		<link rel='stylesheet' href='css/style.css'>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
	</head>
	<body>
		<h1 class='loud-voice'>The great todo app</h1>

		<form id='todoForm'>

				<label for='todo'>Things to do:</label>
				<input id='todo' class='todo-input' type='text' required>
			</div>
			<button id='submit' type='submit'>Submit</button>
			<output>
			</output>
		</form>
		<script src='script.js'></script>
	</body>
</html>
